schema: lafgs_v15_global_sufficiency_closed_loop
version: 3

contracts:
  geometry_frozen: true
  anchor_addition: false
  anchor_retriangulation: false
  loo_anywhere: false
  test_queries_used: false
  mapping_constraints_are_hard: true
  feedback_only_changes_selection_priority: true
  one_constant_safety_floor_across_all_budgets: true
  budget_sets_are_nested_per_policy: true
  expansion_trigger: largest_initial_budget_failed_control_safety

evidence:
  minimum_observation_count: 3
  minimum_view_family_count: 1
  minimum_geometry_reliability: 0.05
  maximum_descriptor_dispersion_quantile: 0.995
  maximum_reprojection_error_quantile: 0.995
  maximum_covariance_trace_quantile: 0.995
  minimum_ray_angular_dispersion_quantile: 0.005

image_grid: [4, 4]
pose_damping: 0.000001
fill_to_budget: true

profiles:
  b80k: &floor
    maximum_anchors: 80000
    precision_rank: 64
    matching_rank: 128
    image_cells: 10
    view_families: 1
    depth_ranges: 2
    pose_logdet: 0.0
    pose_minimum_eigenvalue: 100.0
  b96k:
    <<: *floor
    maximum_anchors: 96000
  b112k:
    <<: *floor
    maximum_anchors: 112000
  b128k:
    <<: *floor
    maximum_anchors: 128000
  b144k:
    <<: *floor
    maximum_anchors: 144000

validation:
  control_batch: same_sealed_feedback_batch_as_initial_budget_curve
  confirmation_batch: remains_unread_until_one_budget_is_selected
  plant: one_global_top1_then_one_standard_poselib

