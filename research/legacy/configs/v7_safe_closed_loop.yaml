schema: lafgs_v7_safe_closed_loop
version: 1

method:
  name: Safeguarded Episodic Closed-Loop Map Distillation
  online_protocol: frozen_superpoint_exact_global_top1_one_standard_poselib
  maximum_rounds: 2
  initial_phase: p0_identity_noop
  invariants:
    - no_source_mapping_rgb
    - no_detector_training
    - no_learned_match_scorer
    - no_query_adapter_or_context_network
    - no_multi_prototype
    - one_anchor_one_id_xyz_descriptor
    - no_gaussian_or_rendered_depth_pnp_coordinates
    - feedback_queries_never_enter_tracks_or_observation_csr
    - feedback_descriptors_never_copied_into_map
    - same_selector_at_initialization_and_after_updates
    - frozen_superpoint_exact_global_top1_one_poselib
    - test_queries_never_update_or_select_the_map

forbidden_formal_features:
  detector_training: true
  learned_match_scorer: true
  query_adapter: true
  multi_prototype: true
  query_geometry_loo: true
  query_descriptor_loo: true
  fixed_probe_train_validation_split: true
  multiple_sensor_variants_per_pose: true
  retrieval: true
  refinement: true

p0:
  required_exact_map_tensor_parity: true
  required_exact_non_timing_query_parity: true
  required_online_contract_parity: true
  expected_stmarys_test_queries: 530

p2_render_certificate:
  detector_input: complete_unmasked_rgb
  quality_mask_stage: post_detector_row_sampling
  decisions: [ACCEPT, UNCERTAIN, REJECT]
  reject_or_uncertain_can_update_map: false
  alpha_minimum: 0.05
  minimum_alpha_supported_fraction: 0.70
  reject_alpha_supported_fraction: 0.20
  minimum_positive_depth_fraction: 0.70
  reject_positive_depth_fraction: 0.20
  minimum_valid_keypoint_fraction: 0.65
  reject_valid_keypoint_fraction: 0.15
  maximum_black_or_hole_fraction: 0.30
  reject_black_or_hole_fraction: 0.80
  quality_fusion_policy: basic_geometry_and_rank_extreme_distortion_and_rgb_structure_v2
  rgb_structure_window_reference_px: 9
  rgb_structure_support_threshold: 0.20
  rgb_structure_dilate_reference_px: 5
  rgb_structure_reference_short_side: 1080
  distortion_mad_multiplier: 20.0
  distortion_tail_quantile: 0.995

p3_selector:
  no_feedback_gate:
    maximum_median_translation_increase_cm: 0.10
    maximum_p90_translation_cm: 2.0
    catastrophic_translation_cm: 100.0
    catastrophic_rotation_deg: 30.0
    require_r2_no_regression: true
    require_r5_no_regression: true
  evidence:
    minimum_observation_count: 3
    minimum_view_family_count: 1
    minimum_geometry_reliability: 0.05
    maximum_descriptor_dispersion_quantile: 0.995
    maximum_reprojection_error_quantile: 0.995
    maximum_covariance_trace_quantile: 0.995
    minimum_ray_angular_dispersion_quantile: 0.005
  image_grid: [4, 4]
  pose_damping: 0.000001
  active_set_change_fraction: 0.10
  profiles:
    large_sufficient: {precision_rank: 512, matching_rank: 1024, image_cells: 16, view_families: 1, depth_ranges: 4, pose_logdet: 0.0, pose_minimum_eigenvalue: 1000.0, maximum_anchors: 180000}
    medium_sufficient: {precision_rank: 256, matching_rank: 512, image_cells: 14, view_families: 1, depth_ranges: 4, pose_logdet: 0.0, pose_minimum_eigenvalue: 500.0, maximum_anchors: 140000}
    small_sufficient: {precision_rank: 128, matching_rank: 256, image_cells: 12, view_families: 1, depth_ranges: 3, pose_logdet: 0.0, pose_minimum_eigenvalue: 250.0, maximum_anchors: 100000}
    aggressive_minimum: {precision_rank: 64, matching_rank: 128, image_cells: 10, view_families: 1, depth_ranges: 2, pose_logdet: 0.0, pose_minimum_eigenvalue: 100.0, maximum_anchors: 60000}

p4_feedback:
  success_translation_cm: 5.0
  success_rotation_deg: 5.0
  oracle_reprojection_px: 4.0
  minimum_oracle_correspondences: 16
  precision_spatial_grid: [4, 4]
  minimum_precision_spatial_cells: 6
  minimum_precision_supporting_rows: 8
  minimum_precision_translation_improvement_cm: 0.05
  minimum_precision_translation_relative_improvement: 0.10
  minimum_precision_rotation_improvement_deg: 0.005
  localizer_keypoints: 2048
  localizer_nms_radius: 4
  require_bitwise_keypoint_score_replay: true
  maximum_descriptor_replay_abs_error: 0.000001

p5_descriptor_controller:
  minimum_pose_families: 2
  learning_rate: 0.35
  harmful_weight: 1.0
  minimum_relative_weight: 0.25
  maximum_relative_weight: 4.0
  trim_fraction: 0.10
  maximum_descriptor_angle_deg: 5.0

p6_confirmation:
  minimum_median_task_improvement: 0.001
  maximum_p90_task_regression: 0.20
  minimum_r5_regression_percent: -0.01
  translation_scale_cm: 5.0
  rotation_scale_deg: 5.0
  catastrophic_translation_cm: 100.0
  catastrophic_rotation_deg: 30.0

future_phases:
  p1_view_roles_and_novel_view_planner: disabled_until_p0_passes
  p2_render_certificate: disabled_until_p1_passes
  p3_unified_selector: disabled_until_p2_passes
  p4_fixed_plant_feedback: disabled_until_p3_passes
  p5_descriptor_controller: disabled_until_p4_passes
  p6_fresh_batch_confirmation: disabled_until_p5_passes
  p8_acquisition: disabled_until_repeated_coverage_deficit
