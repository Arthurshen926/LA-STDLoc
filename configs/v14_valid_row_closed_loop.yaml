schema: lafgs_v14_valid_row_closed_loop
version: 1

plant:
  baseline: v2_preassociation_full_rebuild_m0
  localization: one_global_top1_then_one_standard_poselib
  geometry_frozen: true
  anchor_addition: false
  anchor_retriangulation: false
  loo_anywhere: false
  test_queries_used: false

observer:
  accepted_sample_policy: v2_certificate_accept
  correspondence_policy: v2_row_valid_only
  outputs:
    - nominal_success
    - causal_precision_deficit
    - causal_recoverable_failure
    - unresolved_failure
    - unreliable_query
  causal_replay: anchor_unique_spatially_distributed_first_correct_topk

identification:
  split_unit: pose_family
  split_policy: sha256_ranked_pose_family
  design_fraction: 0.60
  control_fraction: 0.40
  task_error_cap: 4.0
  query_credit: bounded_once_then_distributed_by_changed_row_support

controller:
  default_action: delete_only_active_set
  prefix_sizes: [8, 16, 32, 64, 128]
  descriptor_update: independently_audited_not_selected
  shared_metric: independently_audited_not_selected
  query_detector: outside_map_feedback_loop
  second_localization_pass: false

supervisor:
  exact_plant_replay_required: true
  hard_safety:
    r5_non_decreasing: true
    catastrophic_non_increasing: true
    maximum_q90_increase: 0.05
    maximum_single_capped_regression: 2.0
  substantial_effect:
    minimum_relative_risk_gain: 0.01
    or_minimum_r5_gain_percent: 1.0
    or_joint_q50_q90_relative_gain: 0.01
  bootstrap_unit: pose_family
  pareto_probability: 0.80
  default_probability: 0.95

result:
  selected_control_action: delete_128
  removed_fraction: 0.0007763645516797982
  control_accept_queries: 91
  control_probability_lower_risk: 0.98
  fresh_confirmation_accept_queries: 169
  fresh_confirmation_probability_lower_risk: 0.8455
  classification: pareto_confirmed_not_default
  test_run: false
