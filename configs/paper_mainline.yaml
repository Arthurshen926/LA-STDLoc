schema: lafgs_paper_mainline
version: 2

method:
  name: Rendering-to-Localization Topology Distillation
  status: adaptive
  offline_chain:
    - frozen_rgb_gaussian_prior
    - native_superpoint_mapping_observations
    - kcs_gwff_initialization
    - wide_scaffold_self_localization_reconstruction
    - track_first_cross_view_tracks
    - robust_triangulation
    - gaussian_raster_provenance
    - track_centric_localization_anchor_pool
    - localization_topology_distillation
    - compact_map_self_localization_metric_refresh
    - compact_single_descriptor_map

prior:
  kind: off_the_shelf_rgb_gaussian
  iteration: 30000
  frozen: true
  accepts:
    - vanilla_3dgs
    - vanilla_2dgs
    - enhanced_2dgs
    - anysplat_ff_3dgs

initialization:
  scaffold_budget: 48000
  kcs_keypoints: 2048
  kcs_radius_px: 1
  kcs_min_visible_views: 4
  kcs_min_votes: 2
  kcs_min_consensus_rate: 0.01
  kcs_view_bins: 4
  kcs_min_distinct_view_bins: 2
  kcs_trajectory_bins: 4
  kcs_min_distinct_trajectory_bins: 2
  gwff_trim_fraction: 0.1
  support_mask_policy: support_rgb_only

reconstruction:
  stage_a_steps: adaptive
  stage_a:
    feature_learning_rate: 0.00005
    weight_decay: 0.0001
    hypothesis_topk: 32
    positive_radius_px: 2
    negative_radius_px: 8
    keep_weight: 1
    keep_margin: 0.05
    swap_weight: 1
    swap_margin: 0.05
    miss_weight: 1
    miss_margin: 0.05
    global_attractor_weight: 0.25
    trust_weight: 0.02
    local_peak_weight: 0.01
    local_peak_start_step: 500
    local_peak_interval: 5
    local_peak_max_anchors: 64
    local_peak_neighbors: 8
    local_peak_radius_px: 8
    local_peak_sigma_px: 2
    local_peak_temperature: 0.07
    local_identity_weight: 0.25
    margin_preservation_weight: 4
    high_precision_weight: 0.02
    high_precision_start_step: 500
    high_precision_interval: 5
  track_core: adaptive
  minimum_rows_per_mapping_query: adaptive
  maximum_reserve: adaptive
  pose_reserve_additions: adaptive
  metric_steps: adaptive
  metric_rank: 16
  metric_residual: 0.05
  learning_rate: 0.0002
  temperature: 0.04
  harmful_weight: 0.1
  trust_weight: 1.0
  group_dro_eta: 0.03

deployment:
  sparse_frontend: ulfloc_native_metric
  query_feature_contract: native_resized_input
  keypoints: 2048
  keypoint_reference_area_px: 2073600
  keypoint_minimum: 1024
  keypoint_maximum: 2048
  nms: 2
  global_topk: 1
  max_matches_per_keypoint: 0
  max_matches_per_landmark: 0
  reprojection_error_px: 12
  reprojection_error_diagonal_fraction: 0.005447348607662378
  reprojection_error_angular_tangent: 0.007176912978323976
  confidence: 0.99999
  maximum_iterations: 100000
  minimum_iterations: 1000
  solver: poselib
  pose_solves: 1
  valid_mask_policy: object_and_sky_and_distortion_v1

seeds:
  - 2026
  - 2027
  - 2028

adaptive:
  calibration_split: all_mapping_train
  reference_image_diagonal_px: 2202.9071700822983
  reference_focal_px: 1672.028076171875
  reference_effective_baseline_m: 2.06756077
  matching_rows_fraction: 0.06
  matching_rows_minimum: 32
  matching_rows_maximum: 192
  stage_a_query_epochs: 4.33
  metric_query_epochs: 0.76
  queries_per_pose_bin_squared: 16
  pose_bins_minimum: 2
  pose_bins_maximum: 8
  task_translation_m: 0.05
  task_rotation_deg: 5.0
  depth_residual_fraction: 0.01
  ransac_track_residual_quantile: 0.975
  ransac_reprojection_maximum_px: 12.0
  scaffold_safety_cap: 48000
  track_core_minimum: 0
  track_core_maximum: 16000
  track_core_check_interval: 64
  coverage_reserve_maximum: 16000
  pose_reserve_maximum: 512
  pose_minimum_relative_gain: 0.02
  pose_minimum_objective_relative_gain: 0.001
  pose_minimum_additions: 64
  pose_minimum_matchability: 0.10
  maximum_harmful_rate: 0.10
  maximum_per_source: 1
  maximum_per_spatial_voxel: 3
  image_diversity_weight: 0.05
  depth_diversity_weight: 0.05
  voxel_diversity_weight: 0.05
  descriptor_trim_fraction: 0.2
  calibration_rebuild_relative_drift: 0.25
