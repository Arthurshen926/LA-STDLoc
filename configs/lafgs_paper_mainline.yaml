schema: lafgs_paper_mainline
version: 1

method:
  name: Rendering-to-Localization Topology Distillation
  status: frozen
  offline_chain:
    - frozen_rgb_gaussian_prior
    - native_superpoint_mapping_observations
    - kcs_gwff_initialization
    - track_first_cross_view_tracks
    - robust_triangulation
    - gaussian_raster_provenance
    - track_centric_localization_anchor_pool
    - localization_topology_distillation
    - self_localization_guided_descriptor_reconstruction
    - compact_single_descriptor_map
  excluded_by_default:
    - viewpoint_completion
    - trajectory_stable_candidate_teacher
    - family_prototypes
    - selector
    - pair_lgcv
    - dense_refinement
    - differentiable_pnp
    - bounded_bundle_adjustment
    - learned_sampler
    - custom_consensus_solver
    - test_time_rendering

prior:
  kind: off_the_shelf_rgb_gaussian
  iteration: 30000
  frozen: true
  accepts:
    - vanilla_3dgs
    - vanilla_2dgs
    - enhanced_2dgs

initialization:
  scaffold_budget: 48000
  kcs_keypoints: 2048
  kcs_radius_px: 1
  kcs_min_visible_views: 4
  kcs_min_votes: 2
  kcs_min_consensus_rate: 0.01
  kcs_view_bins: 4
  kcs_min_distinct_view_bins: 2
  kcs_trajectory_bins: 4
  kcs_min_distinct_trajectory_bins: 2
  gwff_trim_fraction: 0.1
  support_mask_policy: support_rgb_only

reconstruction:
  stage_a_steps: 1000
  track_core: 8000
  minimum_rows_per_mapping_query: 96
  maximum_reserve: 16000
  pose_reserve_additions: 256
  metric_steps: 175
  metric_rank: 16
  metric_residual: 0.05
  anchor_residual: 0.02
  learning_rate: 0.0002
  temperature: 0.04
  harmful_weight: 0.1
  trust_weight: 1.0
  group_dro_eta: 0.03

# Retained only so explicit legacy ablation modes remain reproducible. They are
# not built or evaluated by the paper-mainline A0/A1 entrypoint.
family:
  enabled_by_default: false
  maximum_modes_per_anchor: 3
  minimum_observations: 4
  minimum_trajectories: 2
  minimum_view_bins: 2
  minimum_separation: 0.08
  maximum_primary_similarity: 0.995
  trim_fraction: 0.2
  minimum_legal_activations: 3
  minimum_activation_precision: 0.8
  false_activation_cost: 2.0
  maximum_selected: 2048
  biases: "0,-0.01,-0.02,-0.03,-0.05,-0.08"

selector:
  enabled_by_default: false
  retrieval_topk: 16
  core_budget: 384
  fixed_budget: 512
  single_trajectory_oof_folds: 5
  minimum_strict_lcb: 80
  minimum_dependency_groups: 96
  minimum_image_cells: 16
  minimum_log_expected_basis: 11
  representative_count: 64
  pair_count: 256

deployment:
  sparse_frontend: ulfloc_native_metric
  query_feature_contract: native_resized_input
  keypoints: 2048
  nms: 2
  global_topk: 1
  max_matches_per_keypoint: 0
  max_matches_per_landmark: 0
  reprojection_error_px: 12
  solver: poselib
  pose_solves: 1
  dense_refinement: false
  rendering: false
  valid_mask_policy: object_and_sky_and_distortion_v1

seeds:
  - 2026
  - 2027
  - 2028
